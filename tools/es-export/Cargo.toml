[workspace]

[package]
name = "es-export"
version = "0.1.0"
edition = "2021"
description = "Simple CLI tool to export Elasticsearch data to JSON and Excel"
authors = ["es_client team"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Excel export
rust_xlsxwriter = "0.79"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1"

# Base64 for Basic Auth
base64 = "0.22"
