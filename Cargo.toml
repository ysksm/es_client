[workspace]
members = [
    "src-tauri",
    "cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["es_client team"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client (for Elasticsearch REST API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5"

# DuckDB
duckdb = "1.1"

# Encryption
ring = "0.17"
hex = "0.4"
base64 = "0.22"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
colored = "2.1"
