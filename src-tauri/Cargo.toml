[package]
name = "es_client"
version = "0.1.0"
description = "Elasticsearch Index Management Application"
authors = ["es_client team"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "es_client_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client (for Elasticsearch REST API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5"

# DuckDB
duckdb = "1.1"

# Encryption
ring = "0.17"
hex = "0.4"
base64 = "0.22"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

